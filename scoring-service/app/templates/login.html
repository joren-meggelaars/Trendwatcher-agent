{% extends "base.html" %}
{% block title %}Inloggen — Trendwatcher Admin{% endblock %}
{% block content %}
<h1>Inloggen</h1>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="post" action="/admin/login" style="max-width: 20rem;">
  <p><label>Gebruikersnaam<br><input type="text" name="username" required autofocus style="width:100%"></label></p>
  <p><label>Wachtwoord<br><input type="password" name="password" required style="width:100%"></label></p>
  <button type="submit">Inloggen</button>
</form>
{% endblock %}
