<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex, nofollow">
<title>{% block title %}Trendwatch{% endblock %} · Trendwatch</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="/static/manifest.json">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<meta name="theme-color" content="#4f46e5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Trendwatch">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<svg class="sprite" aria-hidden="true" focusable="false">
  <symbol id="i-logo" viewBox="0 0 24 24"><path d="M4 17l5-5 4 4 7-8"/></symbol>
  <symbol id="i-mail" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m4 7 8 6 8-6"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m8 12.5 3 3 5-6"/></symbol>
  <symbol id="i-rss" viewBox="0 0 24 24"><path d="M5 5a14 14 0 0 1 14 14"/><path d="M5 11a8 8 0 0 1 8 8"/><circle cx="6" cy="18" r="1.4"/></symbol>
  <symbol id="i-list" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
  <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></symbol>
  <symbol id="i-logout" viewBox="0 0 24 24"><path d="M10 5H6a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h4M14 8l4 4-4 4M18 12H9"/></symbol>
  <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
  <symbol id="i-undo" viewBox="0 0 24 24"><path d="M1 4v6h6"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="M6 6l12 12"/></symbol>
</svg>

{% set is_admin = request.session.get("is_admin") %}
{% set here = nav_key(request.url.path) %}
<div class="{{ 'shell' if is_admin else 'auth-shell' }}">
  {% if is_admin %}
  <header class="topbar">
    <a class="brand" href="/admin/digests"><span class="brand-mark"><svg class="icon"><use href="#i-logo"/></svg></span>Trendwatch</a>
    <button type="button" class="icon-btn" data-nav-toggle aria-label="Menu"><svg class="icon"><use href="#i-menu"/></svg></button>
  </header>
  <aside class="sidebar">
    <a class="brand" href="/admin/digests"><span class="brand-mark"><svg class="icon"><use href="#i-logo"/></svg></span>Trendwatch</a>
    <nav class="nav">
      <a class="nav-link {{ 'active' if here == 'digests' }}" href="/admin/digests"><svg class="icon"><use href="#i-mail"/></svg>Digests</a>
      <a class="nav-link {{ 'active' if here == 'review' }}" href="/admin/review"><svg class="icon"><use href="#i-check"/></svg>Beoordelen</a>
      <div class="nav-sep"></div>
      <a class="nav-link {{ 'active' if here == 'sources' }}" href="/admin/sources"><svg class="icon"><use href="#i-rss"/></svg>Bronnen</a>
      <a class="nav-link {{ 'active' if here == 'items' }}" href="/admin/items"><svg class="icon"><use href="#i-list"/></svg>Items</a>
      <a class="nav-link {{ 'active' if here == 'batch' }}" href="/admin/items/batch-add"><svg class="icon"><use href="#i-plus"/></svg>Batch-toevoegen</a>
      <div class="nav-sep"></div>
      <a class="nav-link {{ 'active' if here == 'settings' }}" href="/admin/settings"><svg class="icon"><use href="#i-clock"/></svg>Digest-instellingen</a>
      <a class="nav-link {{ 'active' if here == 'config' }}" href="/admin/config"><svg class="icon"><use href="#i-sliders"/></svg>Configuratie</a>
    </nav>
    <form class="sidebar-foot" method="post" action="/admin/logout">
      <button type="submit" class="nav-link"><svg class="icon"><use href="#i-logout"/></svg>Uitloggen</button>
    </form>
  </aside>
  {% endif %}
  <main class="{{ 'main' if is_admin else 'auth-main' }}">
    <div class="container {% block container_class %}{% endblock %}">
{% block content %}{% endblock %}
    </div>
  </main>
</div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<script src="/static/common.js" defer></script>
{% block scripts %}{% endblock %}
</body>
</html>
