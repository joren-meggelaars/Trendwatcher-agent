<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>{% block title %}Trendwatcher Admin{% endblock %}</title>
<style>
  body { font-family: system-ui, -apple-system, Segoe UI, sans-serif; margin: 2rem; color: #1a1a1a; background: #fafafa; }
  h1 { margin-top: 0; }
  nav { margin-bottom: 1.5rem; padding-bottom: 0.75rem; border-bottom: 1px solid #ddd; }
  nav a { margin-right: 1rem; color: #0a58ca; text-decoration: none; }
  nav a:hover { text-decoration: underline; }
  nav form { float: right; margin: 0; }
  table { border-collapse: collapse; width: 100%; margin-bottom: 1.5rem; background: #fff; }
  th, td { border: 1px solid #ddd; padding: 0.5rem 0.75rem; text-align: left; font-size: 0.9rem; }
  th { background: #f0f0f0; }
  .status { padding: 0.15rem 0.5rem; border-radius: 0.25rem; font-size: 0.8rem; font-weight: 600; white-space: nowrap; }
  .status-kandidaat { background: #fff3cd; color: #856404; }
  .status-actief { background: #d4edda; color: #155724; }
  .status-gedeactiveerd { background: #f8d7da; color: #721c24; }
  .error { color: #b00020; margin-bottom: 1rem; }
  .success { color: #155724; background: #d4edda; padding: 0.5rem 0.75rem; border-radius: 0.25rem; margin-bottom: 1rem; }
  form.inline { display: inline; margin: 0; }
  input, select, button, textarea { font-size: 0.9rem; padding: 0.35rem 0.5rem; font-family: inherit; }
  button { cursor: pointer; }
  .pagination { margin-top: 1rem; }
  .pagination a { margin-right: 1rem; }
  .filters, .add-form { margin-bottom: 1.5rem; background: #fff; padding: 1rem; border: 1px solid #ddd; border-radius: 0.25rem; }
  .filters label, .add-form label { margin-right: 1rem; display: inline-block; margin-bottom: 0.5rem; }
</style>
</head>
<body>
{% if request.session.get("is_admin") %}
<nav>
  <a href="/admin/sources">Bronnen</a>
  <a href="/admin/items">Items</a>
  <a href="/admin/items/batch-add">Batch-toevoegen</a>
  <a href="/admin/settings">Digest-instellingen</a>
  <a href="/admin/config">Configuratie</a>
  <form class="inline" method="post" action="/admin/logout">
    <button type="submit">Uitloggen</button>
  </form>
</nav>
{% endif %}
{% block content %}{% endblock %}
</body>
</html>
