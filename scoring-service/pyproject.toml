[project]
name = "scoring-service"
version = "0.1.0"
description = "Security Trendwatch Agent — Fase 1: scoring service"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic-settings>=2.4",
    "voyageai>=0.3",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8.0",
]
