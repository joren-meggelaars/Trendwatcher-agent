networks:
  trendwatch-net:
    driver: bridge
  # Shared with the identity-platform stack (Authentik); created outside compose.
  identity-apps:
    external: true

volumes:
  trendwatch_pgdata:
  # The scheduler's "already scored" cache (seen_items.json). Without this it
  # lives in the container's own layer and is lost on every rebuild/recreate,
  # after which the next run re-scores every entry still in the feeds.
  trendwatch_scheduler_data:

services:
  postgres:
    # Plain postgres:18 has no pgvector extension; app/models.py's
    # EmbeddingVector column needs it on Postgres. pgvector/pgvector:pg18 is
    # the official postgres:18 image plus pgvector pre-built — same base,
    # same data-directory layout, nothing else changes.
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      # Postgres 18 moved PGDATA to /var/lib/postgresql/18/docker and the
      # image's VOLUME declaration moved up to the parent /var/lib/postgresql
      # (which it pre-creates with the right permissions) — mount the named
      # volume there, NOT at the old .../data path, or the container exits
      # immediately on first start.
      - trendwatch_pgdata:/var/lib/postgresql
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - trendwatch-net

  scoring-service:
    build:
      context: ./scoring-service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY}
      VOYAGE_MODEL: ${VOYAGE_MODEL:-voyage-3}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-voyage}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-1024}
      DEFAULT_USER_ID: ${DEFAULT_USER_ID:-joren}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH}
      SESSION_SECRET_KEY: ${SESSION_SECRET_KEY}
      # Internal-only — the scheduler's trigger server, for the admin GUI's
      # "verstuur nu" button. Reachable via the shared network, not the host.
      SCHEDULER_URL: http://scheduler:${TRIGGER_SERVER_PORT:-8001}
      # Console-only, local testing only: turns off the check that stops the server
      # from fetching internal addresses (app/safe_fetch.py). Never true on the VM.
      SAFE_FETCH_ALLOW_PRIVATE: ${SAFE_FETCH_ALLOW_PRIVATE:-false}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - trendwatch-net

  # The admin GUI on its own: this is the ONLY thing to publish (and to put
  # behind the reverse proxy for HTTPS / access from outside). It contains no
  # JSON API routes at all — those live in scoring-service, which is internal
  # to the compose network and has no login. Same image, different app.
  web:
    build:
      context: ./scoring-service
    restart: unless-stopped
    command: ["uvicorn", "app.web:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY}
      VOYAGE_MODEL: ${VOYAGE_MODEL:-voyage-3}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-voyage}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-1024}
      DEFAULT_USER_ID: ${DEFAULT_USER_ID:-joren}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH}
      SESSION_SECRET_KEY: ${SESSION_SECRET_KEY}
      # true once the GUI is served over HTTPS: the session cookie is then
      # only sent over HTTPS. Leave false for plain http on the LAN.
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      # The GUI's public address (the same one the mail's buttons use): form
      # posts from this origin are accepted even if the proxy rewrites Host.
      PUBLIC_BASE_URL: ${FEEDBACK_BASE_URL:-http://${BIND_ADDRESS}:8000}
      SCHEDULER_URL: http://scheduler:${TRIGGER_SERVER_PORT:-8001}
      # Optional sign-in through Authentik (identity-platform repo); OIDC_ISSUER
      # empty = off, only the password login. See .env.example.
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-trendwatcher}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URIS: ${OIDC_REDIRECT_URIS:-}
      OIDC_INTERNAL_URL: ${OIDC_INTERNAL_URL:-http://authentik:9000}
      OIDC_ADMIN_GROUP: ${OIDC_ADMIN_GROUP:-trendwatcher-admin}
      OIDC_SESSION_DAYS: ${OIDC_SESSION_DAYS:-7}
      # Console-only, local testing only: turns off the check that stops the server
      # from fetching internal addresses (app/safe_fetch.py). Never true on the VM.
      SAFE_FETCH_ALLOW_PRIVATE: ${SAFE_FETCH_ALLOW_PRIVATE:-false}
    depends_on:
      scoring-service:
        condition: service_healthy
    ports:
      # Reachable only from the VM's own (LAN-facing) network interface, not
      # every interface on the box — set BIND_ADDRESS in .env to that
      # interface's IP. The reverse proxy (HTTPS, access from outside) points here.
      - "${BIND_ADDRESS}:8000:8000"
      # Loopback only: the target of `tailscale serve` on the VM (see DEPLOY.md,
      # "Via Tailscale"). Nothing outside the VM can reach this one directly.
      - "127.0.0.1:8002:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - trendwatch-net
      # Reaches Authentik as http://authentik:9000 (token exchange, server to
      # server). Create it once on the host: docker network create identity-apps
      - identity-apps

  scheduler:
    build:
      context: ./scheduler
    restart: unless-stopped
    environment:
      SCORING_SERVICE_URL: http://scoring-service:8000
      # Base URL for the 👍/👎 links in the digest email. Must be reachable
      # from the reader's browser (not the internal hostname above).
      FEEDBACK_BASE_URL: ${FEEDBACK_BASE_URL:-http://${BIND_ADDRESS}:8000}
      GRAPH_TENANT_ID: ${GRAPH_TENANT_ID}
      GRAPH_CLIENT_ID: ${GRAPH_CLIENT_ID}
      GRAPH_CLIENT_SECRET: ${GRAPH_CLIENT_SECRET}
      DIGEST_MAILBOX: ${DIGEST_MAILBOX}
      DIGEST_TO_EMAIL: ${DIGEST_TO_EMAIL}
      DIGEST_DRY_RUN: ${DIGEST_DRY_RUN:-true}
      DIGEST_HOUR: ${DIGEST_HOUR:-7}
      DIGEST_TOP_N: ${DIGEST_TOP_N:-5}
      # Minimum spacing between scoring calls across all jobs. 21 keeps
      # Voyage's free tier (3 req/min) happy; with a payment method on file
      # that limit is gone and 0 is fine.
      SCORE_REQUEST_DELAY_SECONDS: ${SCORE_REQUEST_DELAY_SECONDS:-0}
      INGEST_INTERVAL_MINUTES: ${INGEST_INTERVAL_MINUTES:-30}
      MAX_NEW_ENTRIES_PER_SOURCE: ${MAX_NEW_ENTRIES_PER_SOURCE:-10}
      DIGEST_LOOKBACK_DAYS: ${DIGEST_LOOKBACK_DAYS:-3}
      DISCOVERY_DAY: ${DISCOVERY_DAY:-mon}
      DISCOVERY_HOUR: ${DISCOVERY_HOUR:-8}
      DISCOVERY_LOOKBACK_DAYS: ${DISCOVERY_LOOKBACK_DAYS:-30}
      DISCOVERY_MAX_SEARCH_TERMS: ${DISCOVERY_MAX_SEARCH_TERMS:-5}
      DISCOVERY_RESULTS_PER_TERM: ${DISCOVERY_RESULTS_PER_TERM:-5}
      SEARCH_PROVIDER: ${SEARCH_PROVIDER:-}
      SEARCH_API_KEY: ${SEARCH_API_KEY:-}
      MAILBOX_INGEST_ENABLED: ${MAILBOX_INGEST_ENABLED:-false}
      MAILBOX_INGEST_FOLDER: ${MAILBOX_INGEST_FOLDER:-inbox}
      MAILBOX_INGEST_MAX_MESSAGES: ${MAILBOX_INGEST_MAX_MESSAGES:-25}
      MAILBOX_INGEST_HOUR: ${MAILBOX_INGEST_HOUR:-6}
      MANUAL_DIGEST_LOOKBACK_DAYS: ${MANUAL_DIGEST_LOOKBACK_DAYS:-7}
      TRIGGER_SERVER_PORT: ${TRIGGER_SERVER_PORT:-8001}
      SETTINGS_SYNC_INTERVAL_SECONDS: ${SETTINGS_SYNC_INTERVAL_SECONDS:-300}
      SEEN_ITEMS_PATH: /app/data/seen_items.json
      SAFE_FETCH_ALLOW_PRIVATE: ${SAFE_FETCH_ALLOW_PRIVATE:-false}
    volumes:
      - trendwatch_scheduler_data:/app/data
    depends_on:
      scoring-service:
        condition: service_healthy
    networks:
      - trendwatch-net
